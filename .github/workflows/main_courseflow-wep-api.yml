name: Build and deploy ASP.Net Core app to Azure Web App - courseflow-wep-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore CourseFlow.API/CourseFlow.API.csproj

      - name: Build with dotnet
        run: dotnet build CourseFlow.API/CourseFlow.API.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish CourseFlow.API/CourseFlow.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp" --no-restore

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_353A5D239011402CA6617F5941D61943 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D97766D796514C6BA069886FC33B37A5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9D910E70B7B145CA95C0ED6349A97AE8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'courseflow-wep-api'
          slot-name: 'Production'
          package: .
